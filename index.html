<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ragga Compras — Contagem e pedidos</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#F3F2F7;--surface:#FFFFFF;--surface-2:#F8F7FB;--ink:#1C1530;--muted:#6B6480;--line:#E3E0EC;
--brand:#2D204E;--brand-ink:#FFFFFF;--brand-soft:#ECE8F6;--accent:#C98A0B;--accent-soft:#FDF4DF;
--ok:#2E7D57;--ok-soft:#E4F3EA;--warn:#B45309;--warn-soft:#FDEFDD;--bad:#B42318;--bad-soft:#FBE6E4;--info:#3B5BA9;--info-soft:#E6ECF8;
--r:10px;--font:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15111F;--surface:#1E1830;--surface-2:#241D38;--ink:#EEEAF6;--muted:#A39DB5;--line:#342B4A;
--brand:#8B76D6;--brand-ink:#FFFFFF;--brand-soft:#2B2346;--accent:#E7B040;--accent-soft:#33291A;--ok:#5BC08A;--ok-soft:#1B3127;--warn:#E59A4A;--warn-soft:#3A2A18;--bad:#EF7B70;--bad-soft:#3B1D1C;--info:#8EA6E6;--info-soft:#1F2A44;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15111F;--surface:#1E1830;--surface-2:#241D38;--ink:#EEEAF6;--muted:#A39DB5;--line:#342B4A;
--brand:#8B76D6;--brand-ink:#FFFFFF;--brand-soft:#2B2346;--accent:#E7B040;--accent-soft:#33291A;--ok:#5BC08A;--ok-soft:#1B3127;--warn:#E59A4A;--warn-soft:#3A2A18;--bad:#EF7B70;--bad-soft:#3B1D1C;--info:#8EA6E6;--info-soft:#1F2A44;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
h2{font-size:1.35rem;margin:0 0 2px;font-weight:700;letter-spacing:-.01em}
h3{font-size:1.05rem;margin:0 0 6px;font-weight:700}
.muted{color:var(--muted)} .small{font-size:.82rem}
input,select,button{font:inherit;color:inherit}
input,select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-height:36px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.loading{padding:40vh 0;text-align:center;color:var(--muted)}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 14px;cursor:pointer;min-height:36px;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:disabled{opacity:.45;cursor:default}
.btn.full{width:100%}
.link{background:none;border:0;color:var(--brand);cursor:pointer;padding:4px 6px;font-weight:600}
.link.danger{color:var(--bad)}
.icon{background:var(--surface);border:1px solid var(--line);border-radius:8px;width:32px;height:36px;cursor:pointer;font-size:1.1rem}
/* topo */
.top{position:sticky;top:0;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:18px;padding:10px 20px;background:var(--brand);color:#fff;flex-wrap:wrap}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .top{background:#221A3B}}
:root[data-theme="dark"] .top{background:#221A3B}
.brand{font-weight:800;font-size:1.15rem;letter-spacing:-.02em}
.brand span{font-weight:400;opacity:.75}
.tabs{display:flex;gap:2px;flex:1;overflow-x:auto}
.tabs button{background:none;border:0;color:rgba(255,255,255,.72);padding:8px 12px;border-radius:8px;cursor:pointer;font-weight:600;white-space:nowrap}
.tabs button.on{background:rgba(255,255,255,.14);color:#fff}
.top-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top-right .link{color:#fff;opacity:.85}
.date-ctl{display:flex;align-items:center;gap:4px}
.date-ctl input{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25);color:#fff;color-scheme:dark}
.date-ctl .icon{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25);color:#fff}
.conn{font-size:.75rem;padding:3px 8px;border-radius:99px;font-weight:700}
.conn.on{background:rgba(91,192,138,.22);color:#BFF0D4}
.conn.off{background:rgba(231,176,64,.25);color:#FFE3A8}
.who{font-size:.85rem;opacity:.85}
main{padding:22px 20px 110px;max-width:1320px;margin:0 auto}
/* toolbar */
.toolbar{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.toolbar-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.inline{display:inline-flex;align-items:center;gap:6px;font-size:.88rem;white-space:nowrap}
.search{width:100%;margin:10px 0 14px}
.search.small{width:180px;margin:0}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:3px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:7px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--brand);color:var(--brand-ink)}
.banner{padding:12px 14px;border-radius:var(--r);margin:10px 0;font-weight:500}
.banner.ok{background:var(--ok-soft);color:var(--ok)}
.banner.warn{background:var(--warn-soft);color:var(--warn);position:sticky;bottom:12px}
.empty{max-width:560px;margin:10vh auto;text-align:center}
.empty p{color:var(--muted)}
.empty-inline{padding:20px;text-align:center;color:var(--muted)}
.erro{color:var(--bad);font-size:.9rem}
.warn-text{color:var(--warn);font-weight:600}
/* login */
.login-wrap{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:20px;background:var(--brand)}
.login{background:var(--surface);border-radius:16px;padding:32px 28px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px}
.login label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;font-weight:600;color:var(--muted)}
.brand-big{font-size:2.4rem;font-weight:800;line-height:.95;letter-spacing:-.04em;color:var(--brand)}
.brand-big span{font-weight:300}
/* contagem (gerente) */
.contagem{max-width:680px;margin:0 auto}
.cont-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px}
.progress-big{text-align:right;min-width:110px}
.progress-big strong{font-size:2rem;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.progress-big strong span{font-size:1rem;color:var(--muted);font-weight:500}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>div{height:100%;background:var(--brand);border-radius:99px;transition:width .3s}
.cat-block{margin-bottom:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.cat-head{position:sticky;top:0;width:100%;display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:12px 14px 10px;border:0;background:var(--surface-2);cursor:pointer;text-align:left;border-bottom:1px solid var(--line)}
.cat-name{font-weight:700}
.cat-count{font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted)}
.cat-count.done{color:var(--ok)}
.cat-rail{grid-column:1/-1;height:3px;background:var(--line);border-radius:99px;overflow:hidden}
.cat-rail span{display:block;height:100%;background:var(--ok)}
.count-row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line)}
.count-row:last-child{border-bottom:0}
.count-row.filled .count-desc span{color:var(--muted)}
.count-desc{flex:1;display:flex;flex-direction:column;min-width:0}
.count-desc span{font-weight:600;font-size:.95rem}
.count-desc small{color:var(--muted);font-size:.78rem}
.count-input{width:96px;height:46px;font-size:1.2rem;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;border-width:2px}
.count-row.filled .count-input{border-color:var(--ok);background:var(--ok-soft)}
.count-input:disabled{opacity:.8}
.send-bar{position:fixed;left:0;right:0;bottom:0;padding:12px 20px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;z-index:15}
.send-bar span{font-weight:600;color:var(--muted)}
.send-bar .btn{min-height:46px;padding:0 22px}
/* liberação */
.lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-bottom:16px}
.lib-card{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:var(--r);padding:12px 12px 8px}
.lib-card.all{border-left-color:var(--brand)}
.lib-card.some{border-left-color:var(--accent)}
.lib-top{display:flex;align-items:center;gap:10px;cursor:pointer}
.lib-top input{width:20px;height:20px;min-height:0;accent-color:var(--brand)}
.lib-name{flex:1;font-weight:700}
.lib-n{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600}
.lib-card .link{margin-left:24px;font-size:.85rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:16px}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.item-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:2px 16px}
.item-check{display:flex;align-items:center;gap:8px;padding:6px 4px;border-radius:6px;cursor:pointer;font-size:.9rem}
.item-check:hover{background:var(--surface-2)}
.item-check input{min-height:0;accent-color:var(--brand)}
.item-check span{flex:1}
.item-check small{color:var(--muted)}
/* status strip */
.status-strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:6px;margin-bottom:18px}
.st{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:left}
.st b{font-size:.85rem}
.st span{font-size:.75rem;color:var(--muted)}
.st.ok{background:var(--ok-soft);border-color:transparent}.st.ok span{color:var(--ok)}
.st.warn{background:var(--warn-soft);border-color:transparent}.st.warn span{color:var(--warn)}
.st.bad{background:var(--bad-soft);border-color:transparent}.st.bad span{color:var(--bad)}
.st.info{background:var(--info-soft);border-color:transparent}.st.info span{color:var(--info)}
.st.active{outline:2px solid var(--brand);outline-offset:1px}
/* tabelas */
.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.grid{width:100%;border-collapse:collapse;font-size:.88rem;font-variant-numeric:tabular-nums}
.grid th{position:sticky;top:0;background:var(--surface-2);font-weight:700;font-size:.78rem;color:var(--muted);padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.grid td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:right;vertical-align:middle}
.grid .l{text-align:left}
.grid td.l .pd{display:block;font-weight:600}
.grid td.l small{color:var(--muted);font-size:.74rem}
.grid .hl{background:var(--accent-soft)}
.grid th.hl{color:var(--accent)}
.grid .strong{font-weight:700}
.grid tr.pending td{color:var(--muted)}
.grid tr.off td{opacity:.5}
.grid tr.click{cursor:pointer}
.grid tr.click:hover td{background:var(--surface-2)}
.grid tr.sub td{background:var(--surface-2)}
.grid tfoot td{font-weight:800;background:var(--surface-2);border-bottom:0}
.grid.compact td{padding:8px 10px}
.num{width:84px;text-align:right;font-variant-numeric:tabular-nums}
.num.sm{width:78px;min-height:30px;padding:4px 8px}
.num.tiny{width:48px;min-height:30px;padding:4px 6px}
.num.buy{border-color:var(--accent);font-weight:700}
.txt{width:190px;min-height:30px;padding:4px 8px}
.hist{display:block;margin:2px 0 0 auto;border:0;background:none;color:var(--info);font-size:.72rem;cursor:pointer;font-weight:700;padding:0}
.breakdown{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;padding:6px 0}
.bd-cell{display:grid;grid-template-columns:1fr auto;gap:0 8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;text-align:left}
.bd-cell b{font-size:.85rem}.bd-cell span{grid-column:1;font-size:.74rem;color:var(--muted)}
.bd-cell input{grid-row:1/3;grid-column:2}
/* pedidos */
.forn-block{margin-bottom:22px}
.forn-head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.forn-block.sem h3{color:var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:.75rem;background:var(--surface-2);border:1px solid var(--line);border-radius:99px;padding:2px 8px;white-space:nowrap}
/* visão */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:14px 0 18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kpi span{font-size:.82rem;color:var(--muted)}
.kpi strong{font-size:1.7rem;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi strong small{font-size:1rem;color:var(--muted);font-weight:500}
.t-bad{color:var(--bad)}.t-warn{color:var(--warn)}
.two-col{display:grid;grid-template-columns:3fr 2fr;gap:16px}
@media(max-width:900px){.two-col{grid-template-columns:1fr}}
.hbar{margin-bottom:10px}
.hbar-l{display:flex;justify-content:space-between;font-size:.88rem;margin-bottom:4px}
.pill{display:inline-block;font-size:.75rem;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.info{background:var(--info-soft);color:var(--info)}
/* modal e toast */
.modal-bg{position:fixed;inset:0;background:rgba(20,14,35,.5);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--surface);border-radius:14px;padding:22px;width:100%;max-width:520px;max-height:90vh;overflow:auto}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:.84rem;font-weight:600;color:var(--muted)}
.form label.inline{flex-direction:row;color:var(--ink)}
.form .span2{grid-column:1/-1}
fieldset{border:1px solid var(--line);border-radius:8px;display:flex;gap:14px;flex-wrap:wrap;padding:10px 12px}
legend{font-size:.84rem;font-weight:600;color:var(--muted);padding:0 4px}
.toast{pointer-events:none;position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:60;max-width:90vw;text-align:center}
@media(max-width:700px){
  .top{padding:10px 14px;gap:8px}.tabs{order:3;flex-basis:100%}.who{display:none}
  main{padding:16px 12px 110px}.search.small{width:100%}
  .cont-head{flex-direction:column;align-items:stretch}.progress-big{text-align:left}
  .form{grid-template-columns:1fr}
}
@media print{.noprint,.top,.toast{display:none!important}body{background:#fff}main{padding:0}.table-wrap{border:0}.grid th{position:static}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* v2: gerente pede, compras valida */
.cont-tools{display:flex;gap:8px;align-items:center;margin:10px 0 14px}
.cont-tools .search{margin:0;flex:1}
.count-fields{display:flex;gap:8px}
.cf{display:flex;flex-direction:column;align-items:center;gap:2px}
.cf small{font-size:.7rem;color:var(--muted);font-weight:600;white-space:nowrap}
.count-input{width:84px}
.count-input.buy{border-color:var(--accent);background:var(--accent-soft)}
.count-row.filled .count-input.buy{border-color:var(--accent);background:var(--accent-soft)}
.count-input.adjusted,.num.adjusted{border-color:var(--info);background:var(--info-soft);color:var(--info)}
.adj{font-style:normal;font-size:.76rem;font-weight:700;color:var(--info);margin-top:2px}
.banner.info{background:var(--info-soft);color:var(--info)}
.banner.static{position:static}
.val-bar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:16px}
.val-bar p{margin:2px 0 0;color:var(--muted)}
.val-bar.ready{border-left-color:var(--info)}
.val-bar.ok{border-left-color:var(--ok)}
.val-bar.ok p{color:var(--ok)}
.grid td.strike{text-decoration:line-through;color:var(--muted)}
.table-wrap.flat{border:0}
@media(max-width:520px){
  .count-row{flex-wrap:wrap}
  .count-desc{flex-basis:100%}
  .count-fields{width:100%}
  .cf{flex:1}.cf .count-input{width:100%}
}

.sb-info{white-space:nowrap;font-size:.85rem;line-height:1.3}.sb-info b{color:var(--ink)}
.toast{top:calc(70px + env(safe-area-inset-top,0px));bottom:auto}
/* v3: Sim/Não e médias */
.dec{min-width:132px}
.dec-btns{display:inline-flex;gap:4px}
.dec-btns button{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:4px 12px;font-weight:700;cursor:pointer;min-height:30px}
.dec-btns .yes{color:var(--ok);border-color:var(--ok)}
.dec-btns .yes:hover{background:var(--ok);color:#fff}
.dec-btns .no{color:var(--bad);border-color:var(--bad)}
.dec-btns .no:hover{background:var(--bad);color:#fff}
.dec-ok{display:inline-flex;align-items:center;gap:6px;color:var(--ok);font-weight:700}
.dec-edit{display:inline-flex;align-items:center;gap:4px}
.mini{border:0;background:none;color:var(--muted);cursor:pointer;font-size:.78rem;font-weight:600;padding:2px 4px}
.mini:hover{color:var(--brand)}
.mini.add{color:var(--brand)}
.grid tr.adj-row td:first-child{box-shadow:inset 3px 0 0 var(--info)}
.tag{display:block;font-size:.68rem;color:var(--muted)}
.t-info{color:var(--info)}
.val-bar h3{margin:0}
.count-input:disabled{cursor:not-allowed;background:var(--surface-2);border-style:dashed}
.btn.danger-outline{color:var(--bad);border-color:var(--bad)}
.cont-tools .inline{font-weight:600}
/* v5: envio ao fornecedor */
.forn-card-head{padding:14px 14px 10px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.forn-card-head h3{margin:0}
.forn-card.sent{border-color:var(--ok)}
.forn-card.sent .forn-card-head{background:var(--ok-soft)}
.qty{font-size:1.25rem;font-variant-numeric:tabular-nums;min-width:60px;text-align:right}
.forn-card-actions{display:flex;gap:8px;padding:12px 14px;flex-wrap:wrap;border-top:1px solid var(--line)}
.forn-card-actions .btn{flex:1;min-height:44px}
.btn.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.envio-strip{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:-2px 0 10px}
.forn-card .count-row{flex-wrap:nowrap}.forn-card .count-desc{flex-basis:auto}
/* v6: mensagem WhatsApp */
.forn-extra{padding:10px 14px 0;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.obs{display:flex;flex-direction:column;gap:4px;width:100%;font-size:.8rem;font-weight:600;color:var(--muted)}
.obs input{width:100%}
.zap{width:100%;background:#E7DED4;border-radius:10px;padding:12px;margin:4px 0 2px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .zap{background:#0E1A17}}
.zap-bubble{background:#D9FDD3;color:#111B21;border-radius:8px 0 8px 8px;padding:8px 10px;font-size:.88rem;line-height:1.4;margin-left:auto;max-width:92%;box-shadow:0 1px .5px rgba(0,0,0,.13);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .zap-bubble{background:#005C4B;color:#E9EDEF}}
.zap-l{white-space:pre-wrap;word-break:break-word}
/* v8: grupos de contagem */
.sec-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:6px 0 8px}
.sec-head h3{margin:0}
.lib-card.grupo{border-left-color:var(--accent)}

.grupo-desc{margin:4px 0 0 30px;font-size:.8rem;color:var(--muted)}
.novo-grupo{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:1.5px dashed var(--line);border-left:1.5px dashed var(--line);background:transparent;cursor:pointer;text-align:left;color:var(--brand);font-weight:700}
.novo-grupo:hover{border-color:var(--brand)}
.novo-grupo small{font-weight:400;color:var(--muted)}
.modal{max-width:640px}
.ge-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}
.ge-list{max-height:42vh;overflow:auto;border:1px solid var(--line);border-radius:8px}
.ge-cat{border-bottom:1px solid var(--line)}
.ge-cat:last-child{border-bottom:0}
.ge-cat-head{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--surface-2);position:sticky;top:0}
.ge-cat-head input{min-height:0;width:18px;height:18px;accent-color:var(--brand)}
.ge-cat-name{flex:1;text-align:left;border:0;background:none;font-weight:700;cursor:pointer;padding:2px 0}
.ge-item{padding-left:34px}
.modal-actions{align-items:center}
.tabs{flex-wrap:wrap;min-width:0}.tabs button{padding:7px 10px}
/* v9: resumo de pedidos e valores */
.money{display:flex;gap:18px}
.money div{display:flex;flex-direction:column;align-items:flex-end}
.money span{font-size:.75rem;color:var(--muted)}
.money b{font-size:1.15rem;font-variant-numeric:tabular-nums}
.resumo{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
@media(max-width:900px){.resumo{grid-template-columns:1fr}}
.resumo-kpis,.resumo-cats{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.kpi-row{display:flex;gap:26px;flex-wrap:wrap;margin-top:6px}
.kpi-row div{display:flex;flex-direction:column}
.kpi-row span{font-size:.8rem;color:var(--muted)}
.kpi-row strong{font-size:1.5rem;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi-row .muted-strong{color:var(--muted)}
.hbar-btn{display:block;width:100%;background:none;border:0;padding:4px 6px;border-radius:6px;cursor:pointer;text-align:left}
.hbar-btn:hover{background:var(--surface-2)}
.hbar-btn.on{background:var(--brand-soft)}
/* v10: unidade de compra */
.equiv{font-style:normal;font-size:.7rem;color:var(--muted);font-weight:600;margin-top:2px;white-space:nowrap}
.un-cell small{display:block;font-size:.7rem;color:var(--accent);font-weight:700;white-space:nowrap}
.qty small{display:block;font-size:.7rem;color:var(--muted);font-weight:600;text-align:right}
.txt.un{width:110px}
.grid td.l small{display:block}
.cf small{white-space:normal;text-align:center;line-height:1.2}
/* v11: importação */
.upload{display:flex;align-items:center;justify-content:center;border:2px dashed var(--line);border-radius:10px;padding:18px;margin:10px 0;cursor:pointer;font-weight:700;color:var(--brand)}
.upload:hover{border-color:var(--brand);background:var(--brand-soft)}
.upload input{display:none}
.imp-list{display:flex;flex-direction:column;gap:6px;max-height:38vh;overflow:auto}

.imp-row.ok{border-left-color:var(--ok)}.imp-row.warn{border-left-color:var(--warn)}.imp-row.bad{border-left-color:var(--bad)}
.imp-row select{max-width:190px}
.imp-file{flex:1;min-width:0;display:flex;flex-direction:column}
.imp-file b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.88rem}

.imp-row.bad small{color:var(--bad)}
.imp-resumo{margin-top:12px;padding:12px;background:var(--surface-2);border-radius:10px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
